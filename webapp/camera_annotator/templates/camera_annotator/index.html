{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Frame Annotator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            background: #1a1a1a;
        }

        /* Left panel - Image */
        #image-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #222;
            overflow: hidden;
        }

        #image-container {
            flex: 1;
            overflow: auto;
            cursor: crosshair;
        }

        #image-wrapper {
            position: relative;
            display: inline-block;
        }

        #frame-image {
            display: block;
            max-width: none;
        }

        /* Droplet-style markers (same as point-picker) */
        .marker {
            position: absolute;
            width: 24px;
            height: 28px;
            margin-left: -12px;
            margin-top: -28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            pointer-events: auto;
            cursor: grab;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
        }

        .marker.dragging {
            cursor: grabbing;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
            z-index: 10;
        }

        .marker::before {
            content: '';
            position: absolute;
            top: 0;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            transform-origin: center center;
            border: 2px solid white;
            background: #2196f3;
        }

        .marker::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 6px;
            height: 6px;
            margin-left: -3px;
            background: #2196f3;
            border: 2px solid white;
            border-radius: 50%;
        }

        .marker span {
            position: absolute;
            top: 1px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1;
        }

        .marker.pending::before {
            background: #ff9800;
        }

        .marker.pending::after {
            background: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Right panel - Controls & Preview */
        #control-panel {
            width: 400px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #333;
        }

        .panel-section {
            padding: 16px;
            border-bottom: 1px solid #ddd;
        }

        .panel-section h2 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #image-selector {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        #image-selector:hover {
            border-color: #2196f3;
        }

        #image-selector:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        #filename {
            font-size: 12px;
            color: #666;
            word-break: break-all;
            margin-bottom: 8px;
        }

        /* GCP Input */
        #gcp-input-section {
            display: none;
        }

        #gcp-input-section.active {
            display: block;
            background: #e3f2fd;
        }

        #gcp-search {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #2196f3;
            border-radius: 6px;
            outline: none;
        }

        #gcp-search:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        #gcp-dropdown {
            max-height: 200px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 8px;
        }

        .gcp-option {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .gcp-option:hover, .gcp-option.selected {
            background: #e3f2fd;
        }

        .gcp-option .id {
            font-weight: 600;
            color: #1976d2;
        }

        .gcp-option .coords {
            font-size: 11px;
            color: #666;
        }

        /* Annotations list */
        #annotations-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .annotation-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #fff;
            border-radius: 4px;
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .annotation-item .info {
            font-size: 13px;
        }

        .annotation-item .gcp-id {
            font-weight: 600;
            color: #1976d2;
        }

        .annotation-item .pixel {
            color: #666;
            font-size: 11px;
        }

        .annotation-item .delete-btn {
            background: #f44336;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .annotation-item .delete-btn:hover {
            background: #d32f2f;
        }

        /* Instructions */
        #instructions {
            padding: 12px;
            background: #fff3e0;
            font-size: 12px;
            color: #e65100;
        }

        /* Coordinates display */
        #coords-display {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            z-index: 100;
        }

        .back-link:hover {
            background: rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>
    <a href="{% url 'gcp:index' %}" class="back-link">&larr; Back to Tools</a>

    <div id="image-panel">
        <div id="image-container">
            <div id="image-wrapper">
                <img id="frame-image" src="{% url 'camera_annotator:serve_image' %}" alt="Camera Frame">
            </div>
        </div>
    </div>

    <div id="control-panel">
        <div class="panel-section">
            <h2>Select Image</h2>
            <select id="image-selector">
                <!-- Options populated via JavaScript -->
            </select>
        </div>

        <div class="panel-section">
            <h2>Camera Frame</h2>
            <div id="filename">{{ image_filename }}</div>
            <div id="instructions">Click on the image to add annotation points. Drag markers to adjust. Type to filter GCPs.</div>
        </div>

        <div id="gcp-input-section" class="panel-section">
            <h2>Select GCP for Point</h2>
            <input type="text" id="gcp-search" placeholder="Type to filter GCPs..." autocomplete="off">
            <div id="gcp-dropdown"></div>
        </div>

        <div class="panel-section">
            <h2>Annotations (<span id="annotation-count">0</span>)</h2>
        </div>
        <div id="annotations-list"></div>
    </div>

    <div id="coords-display">Move mouse over image</div>

    <script src="{% static 'js/tenant.js' %}"></script>
    <script>
        // API base URL
        const API_BASE = '{% url "camera_annotator:index" %}';

        // State
        let gcps = [];
        let annotations = [];
        let pendingPoint = null;
        let selectedGcpIndex = -1;
        let filteredGcps = [];
        let dragging = null; // { index, offsetX, offsetY } when dragging a marker

        // Elements
        const img = document.getElementById('frame-image');
        const wrapper = document.getElementById('image-wrapper');
        const gcpSection = document.getElementById('gcp-input-section');
        const gcpSearch = document.getElementById('gcp-search');
        const gcpDropdown = document.getElementById('gcp-dropdown');
        const annotationsList = document.getElementById('annotations-list');
        const annotationCount = document.getElementById('annotation-count');
        const coordsDisplay = document.getElementById('coords-display');
        const imageSelector = document.getElementById('image-selector');
        const filenameDisplay = document.getElementById('filename');

        // Load GCPs
        async function loadGcps() {
            const resp = await fetch('{% url "camera_annotator:api_gcps" %}');
            gcps = await resp.json();
            filteredGcps = [...gcps];
        }

        // Render markers
        function renderMarkers() {
            // Remove existing markers
            wrapper.querySelectorAll('.marker').forEach(m => m.remove());

            // Add annotation markers
            annotations.forEach((ann, i) => {
                const marker = document.createElement('div');
                marker.className = 'marker';
                marker.style.left = ann.pixel_x + 'px';
                marker.style.top = ann.pixel_y + 'px';
                const label = document.createElement('span');
                label.textContent = ann.gcp_id;
                marker.appendChild(label);

                // Drag to adjust
                marker.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dragging = { index: i };
                    marker.classList.add('dragging');
                });

                wrapper.appendChild(marker);
            });

            // Add pending marker
            if (pendingPoint) {
                const marker = document.createElement('div');
                marker.className = 'marker pending';
                marker.style.left = pendingPoint.x + 'px';
                marker.style.top = pendingPoint.y + 'px';
                const label = document.createElement('span');
                label.textContent = '?';
                marker.appendChild(label);
                wrapper.appendChild(marker);
            }
        }

        // Filter GCPs
        function filterGcps(query) {
            const q = query.toLowerCase();
            filteredGcps = gcps.filter(g => g.id.toLowerCase().includes(q));

            // Exclude already used GCPs
            const usedIds = new Set(annotations.map(a => a.gcp_id));
            filteredGcps = filteredGcps.filter(g => !usedIds.has(g.id));

            selectedGcpIndex = filteredGcps.length > 0 ? 0 : -1;
            renderGcpDropdown();
        }

        // Render GCP dropdown
        function renderGcpDropdown() {
            gcpDropdown.innerHTML = '';

            if (filteredGcps.length === 0) {
                gcpDropdown.innerHTML = '<div style="padding: 12px; color: #999;">No matching GCPs</div>';
                return;
            }

            filteredGcps.forEach((gcp, i) => {
                const div = document.createElement('div');
                div.className = 'gcp-option' + (i === selectedGcpIndex ? ' selected' : '');
                div.innerHTML = `
                    <span class="id">${gcp.id}</span>
                    <span class="coords">(${gcp.pixel_x.toFixed(1)}, ${gcp.pixel_y.toFixed(1)})</span>
                `;
                div.addEventListener('click', () => selectGcp(gcp));
                gcpDropdown.appendChild(div);
            });
        }

        // Select GCP for pending point
        function selectGcp(gcp) {
            if (!pendingPoint) return;

            annotations.push({
                pixel_x: pendingPoint.x,
                pixel_y: pendingPoint.y,
                gcp_id: gcp.id
            });

            pendingPoint = null;
            gcpSection.classList.remove('active');
            gcpSearch.value = '';

            renderMarkers();
            renderAnnotationsList();
            updateYamlPreview();
            autoSave();
        }

        // Persist the current annotation list to the repo. Called after every
        // mutation (add, move, delete). Failures are logged, never alerted, so
        // an auto-save error does not interrupt the annotation workflow.
        async function autoSave() {
            const cleanAnnotations = annotations.map(a => ({
                gcp_id: a.gcp_id,
                pixel_x: parseFloat(a.pixel_x.toFixed(1)),
                pixel_y: parseFloat(a.pixel_y.toFixed(1)),
            }));

            try {
                const resp = await fetch('{% url "camera_annotator:api_save_annotations" %}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ annotations: cleanAnnotations })
                });
                const result = await resp.json();
                if (!result.success) {
                    console.error('Auto-save failed:', result.error || 'Unknown error');
                }
            } catch (err) {
                console.error('Auto-save failed:', err.message);
            }
        }

        // Render annotations list
        function renderAnnotationsList() {
            annotationsList.innerHTML = '';
            annotationCount.textContent = annotations.length;

            annotations.forEach((ann, i) => {
                const div = document.createElement('div');
                div.className = 'annotation-item';
                div.innerHTML = `
                    <div class="info">
                        <span class="gcp-id">${ann.gcp_id}</span>
                        <span class="pixel">(${ann.pixel_x.toFixed(1)}, ${ann.pixel_y.toFixed(1)})</span>
                    </div>
                    <button class="delete-btn" data-index="${i}">Delete</button>
                `;
                annotationsList.appendChild(div);
            });

            // Add delete handlers
            annotationsList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    annotations.splice(idx, 1);
                    renderMarkers();
                    renderAnnotationsList();
                    updateYamlPreview();
                    autoSave();
                });
            });
        }

        // Placeholder for removed YAML preview — no-op to avoid breaking callers
        function updateYamlPreview() {}

        // Event: Click on image (only when not dragging)
        img.addEventListener('click', (e) => {
            if (dragging) return;

            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            pendingPoint = { x, y };
            gcpSection.classList.add('active');
            gcpSearch.value = '';
            filterGcps('');
            gcpSearch.focus();

            renderMarkers();
        });

        // Event: Mouse move — drag marker or show coordinates
        wrapper.addEventListener('mousemove', (e) => {
            const rect = img.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (dragging) {
                e.preventDefault();
                const ann = annotations[dragging.index];
                ann.pixel_x = Math.max(0, Math.min(img.naturalWidth, x));
                ann.pixel_y = Math.max(0, Math.min(img.naturalHeight, y));

                // Live-update the marker position without full re-render
                const markers = wrapper.querySelectorAll('.marker:not(.pending)');
                const marker = markers[dragging.index];
                if (marker) {
                    marker.style.left = ann.pixel_x + 'px';
                    marker.style.top = ann.pixel_y + 'px';
                }
                coordsDisplay.textContent = `Dragging ${ann.gcp_id}: (${ann.pixel_x.toFixed(1)}, ${ann.pixel_y.toFixed(1)})`;
            } else {
                coordsDisplay.textContent = `Pixel: (${x.toFixed(1)}, ${y.toFixed(1)})`;
            }
        });

        // Event: Mouse up — finish drag
        window.addEventListener('mouseup', (e) => {
            if (!dragging) return;
            dragging = null;
            renderMarkers();
            renderAnnotationsList();
            updateYamlPreview();
            autoSave();
        });

        // Event: GCP search input
        gcpSearch.addEventListener('input', (e) => {
            filterGcps(e.target.value);
        });

        // Event: Keyboard navigation in dropdown
        gcpSearch.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (selectedGcpIndex < filteredGcps.length - 1) {
                    selectedGcpIndex++;
                    renderGcpDropdown();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (selectedGcpIndex > 0) {
                    selectedGcpIndex--;
                    renderGcpDropdown();
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (selectedGcpIndex >= 0 && filteredGcps[selectedGcpIndex]) {
                    selectGcp(filteredGcps[selectedGcpIndex]);
                }
            } else if (e.key === 'Escape') {
                pendingPoint = null;
                gcpSection.classList.remove('active');
                renderMarkers();
            }
        });

        // Load existing annotations
        async function loadExistingAnnotations() {
            try {
                const resp = await fetch('{% url "camera_annotator:api_annotations" %}');
                const existing = await resp.json();
                if (existing && existing.length > 0) {
                    annotations = existing;
                    renderMarkers();
                    renderAnnotationsList();
                    updateYamlPreview();
                }
            } catch (e) {
                console.error('Failed to load existing annotations:', e);
            }
        }

        // Load available images and populate selector
        async function loadAvailableImages() {
            try {
                const resp = await fetch('{% url "camera_annotator:api_images" %}');
                const images = await resp.json();
                imageSelector.innerHTML = '';
                images.forEach(filename => {
                    const option = document.createElement('option');
                    option.value = filename;
                    option.textContent = filename;
                    // Select current image
                    if (filename === filenameDisplay.textContent) {
                        option.selected = true;
                    }
                    imageSelector.appendChild(option);
                });
            } catch (e) {
                console.error('Failed to load available images:', e);
            }
        }

        // Switch to a different image
        async function switchImage(filename) {
            try {
                const resp = await fetch('{% url "camera_annotator:api_switch_image" %}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename })
                });
                const data = await resp.json();

                if (data.success) {
                    // Clear pending point first
                    pendingPoint = null;
                    gcpSection.classList.remove('active');

                    // Load new annotations from response
                    annotations = data.annotations || [];

                    // Update filename display
                    filenameDisplay.textContent = data.filename;

                    // Update image src with cache-busting query param
                    // Re-render markers after image loads
                    img.onload = function() {
                        renderMarkers();
                    };
                    img.src = withTenant('{% url "camera_annotator:serve_image" %}?t=' + Date.now());

                    // Update other UI elements
                    renderAnnotationsList();
                    updateYamlPreview();
                } else {
                    alert('Failed to switch image: ' + (data.error || 'Unknown error'));
                }
            } catch (e) {
                alert('Failed to switch image: ' + e.message);
            }
        }

        // Event: Image selector change
        imageSelector.addEventListener('change', (e) => {
            switchImage(e.target.value);
        });

        // Fix initial image src with tenant_id
        if (TENANT_ID) img.src = withTenant(img.src);

        // Initialize
        loadGcps().then(() => {
            loadAvailableImages().then(() => {
                loadExistingAnnotations().then(() => {
                    updateYamlPreview();
                });
            });
        });
    </script>
<script>
(function() {
    var tid = new URLSearchParams(window.location.search).get('tenant_id');
    if (tid) {
        document.querySelectorAll('a').forEach(function(a) {
            if (a.textContent.trim().includes('Back to Tools')) {
                var url = new URL(a.href, window.location.origin);
                url.searchParams.set('tenant_id', tid);
                a.href = url.toString();
            }
        });
    }
})();
</script>
</body>
</html>
