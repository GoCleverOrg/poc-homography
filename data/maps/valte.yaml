# Map configuration for Valte site
id: valte
photo:
  path: Cartografia_valencia.tif
geotiff:
  # GDAL 6-parameter GeoTransform format
  # [origin_easting, pixel_width, row_rotation, origin_northing, col_rotation, pixel_height]
  geotransform:
    - 737575.05    # origin_easting (UTM X of top-left corner)
    - 0.15         # pixel_width (meters per pixel, positive = east)
    - 0.0          # row_rotation (0 for north-up)
    - 4391595.45   # origin_northing (UTM Y of top-left corner)
    - 0.0          # col_rotation (0 for north-up)
    - -0.15        # pixel_height (meters per pixel, negative for north-up)
  crs: "EPSG:25830"  # UTM zone 30N
