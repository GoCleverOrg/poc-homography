# Ground Control Points (GCPs) Test Data
# Format for homography precision testing with pytest
#
# Each test case contains:
#   - image: path to the camera image (relative to project root)
#   - gcps: list of at least 5 ground control points (for holdout validation)
#     - pixel_x: x coordinate in camera image (pixels)
#     - pixel_y: y coordinate in camera image (pixels)
#     - map_point_id: ID of corresponding MapPoint in registry
#
# NOTE: 5+ GCPs required - 4 are used to compute homography, rest for validation

test_cases:
  - name: test_case1
    image: valte_30.8_13.1_1_12-01-2026.png
