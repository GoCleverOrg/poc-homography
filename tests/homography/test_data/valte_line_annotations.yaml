# Line Annotations Test Data
# Format for homography precision testing with line-based validation
#
# Terminology:
#   - Line Annotation: A line segment observed in the camera image (camera pixels)
#   - Line (from registry): A reference line defined by two GCPs (map pixels)
#
# Each test case contains:
#   - name: unique identifier for the test case
#   - image: path to the camera image (relative to test_data directory)
#   - camera_status: PTZ values for the camera position
#     - pan: horizontal rotation in degrees
#     - tilt: vertical rotation in degrees
#     - zoom: zoom level (1 = no zoom)
#   - point_annotations_ref: reference to point annotations file for homography computation
#   - line_annotations: list of line segments observed in the camera image
#     - line_id: ID of corresponding line in the line registry
#     - start_pixel_x: x coordinate of line start in camera image (pixels)
#     - start_pixel_y: y coordinate of line start in camera image (pixels)
#     - end_pixel_x: x coordinate of line end in camera image (pixels)
#     - end_pixel_y: y coordinate of line end in camera image (pixels)
#
# NOTE: Line annotation endpoints represent where the line appears in the camera,
# NOT the exact GCP locations. They allow measuring reprojection error.
# The line_id references the ground truth line from the line registry.

line_registry: Cartografia_valencia_lines.yaml

