# Annotations and GCP Correspondences Test Data
# Format for homography precision testing with pytest
#
# Terminology:
#   - Annotation: A point marked on the camera image (camera pixels)
#   - GCP (Ground Control Point): A reference point on the map (map pixels)
#
# Each test case contains:
#   - name: unique identifier for the test case
#   - image: path to the camera image (relative to test_data directory)
#   - camera_status: PTZ values for the camera position
#     - pan: horizontal rotation in degrees
#     - tilt: vertical rotation in degrees
#     - zoom: zoom level (1 = no zoom)
#   - annotations: list of at least 5 annotation-to-GCP correspondences (for holdout validation)
#     - pixel_x: x coordinate in camera image (pixels)
#     - pixel_y: y coordinate in camera image (pixels)
#     - gcp_id: ID of corresponding GCP (MapPoint) in registry
#
# NOTE: 5+ annotations required - 4 are used to compute homography, rest for validation

